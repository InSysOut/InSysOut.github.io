  <script>
    // Live Gulf Standard Time
    function updateTime(){
      document.getElementById('local-time').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai',hour12:false});
    }
    updateTime(); setInterval(updateTime,30000);

    // Language toggle (shared preference with insysout.com)
    const html=document.documentElement, toggle=document.getElementById('lang-toggle');
    const enBtn=toggle.querySelector('.lang-en'), arBtn=toggle.querySelector('.lang-ar');
    const wmEn=document.querySelector('.wm-en'), wmAr=document.querySelector('.wm-ar');
    function setLanguage(lang){
      const isAr=lang==='ar'; html.lang=lang; html.dir=isAr?'rtl':'ltr';
      document.querySelectorAll('[data-en]').forEach(el=>{const v=el.getAttribute(isAr?'data-ar':'data-en'); if(v!==null) el.textContent=v;});
      document.querySelectorAll('[data-en-html]').forEach(el=>{const v=el.getAttribute(isAr?'data-ar-html':'data-en-html'); if(v!==null) el.innerHTML=v;});
      document.querySelectorAll('[data-en-label]').forEach(el=>{const v=el.getAttribute(isAr?'data-ar-label':'data-en-label'); if(v!==null) el.setAttribute('aria-label',v);});
      wmEn.hidden=isAr; wmAr.hidden=!isAr;
      enBtn.classList.toggle('active',!isAr); arBtn.classList.toggle('active',isAr);
      const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();
      try{ localStorage.setItem('insysout-lang',lang); }catch(e){}
      window.dispatchEvent(new Event('langchange'));
    }
    toggle.addEventListener('click',()=>setLanguage(html.lang==='ar'?'en':'ar'));
    let initial='en'; try{ const s=localStorage.getItem('insysout-lang'); if(s==='ar'||s==='en') initial=s; }catch(e){}
    setLanguage(initial);
  </script>
