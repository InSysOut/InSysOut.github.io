<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minimal Relay Chat</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      font-family: system-ui, sans-serif;
    }

    input, button {
      padding: 10px;
      margin: 4px;
    }

    #messages {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<h2>Minimal Relay Chat</h2>

<input id="server" value="ws://:8080">
<input id="room" value="test-room">
<button onclick="connect()">Connect</button>

<div id="messages"></div>

<input id="message" placeholder="Message">
<button onclick="sendMessage()">Send</button>

<script>
let socket;

function log(text) {
  const div = document.createElement("div");
  div.textContent = text;
  document.getElementById("messages").appendChild(div);
}

function connect() {
  const server = document.getElementById("server").value;
  const room = encodeURIComponent(
    document.getElementById("room").value
  );

  socket = new WebSocket(`${server}?room=${room}`);

  socket.onopen = () => log("Connected");

  socket.onmessage = event => {
    log("Peer: " + event.data);
  };

  socket.onclose = () => log("Disconnected");

  socket.onerror = () => log("Connection error");
}

function sendMessage() {
  const input = document.getElementById("message");

  if (!socket || socket.readyState !== WebSocket.OPEN) {
    alert("Not connected");
    return;
  }

  socket.send(input.value);
  log("Me: " + input.value);

  input.value = "";
}
</script>

</body>
</html>
